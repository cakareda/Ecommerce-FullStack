# Uygulama Adı
spring.application.name=ecom-proj

# Active profile: 'dev' (H2, in-memory, no external infra) by default.
# Override with SPRING_PROFILES_ACTIVE=docker (or prod) to use PostgreSQL/Mongo/RabbitMQ.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Dosya Yükleme Limitleri (Ürün Resimleri İçin)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Güvenlik Konfigürasyonu
app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwtExpirationMs=86400000

# Swagger / OpenAPI Dokümantasyon Yolları
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html