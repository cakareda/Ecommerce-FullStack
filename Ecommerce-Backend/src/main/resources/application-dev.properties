# Development / test profile - H2 in-memory database, no external infrastructure required.

spring.datasource.url=jdbc:h2:mem:EcommerceDB
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=project1

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway is not used against H2 in dev/test - Hibernate ddl-auto + data1.sql handle local bootstrap.
spring.flyway.enabled=false

# MongoDB - local instance expected on default port; audit writes fail gracefully if unavailable.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/ecommerce_audit}

# RabbitMQ - local defaults
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
