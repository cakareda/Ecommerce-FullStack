name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend (Java 21 / Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecommerce-Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: mvn -B -q test -Dtest='!*IT'

      - name: Run integration tests (Testcontainers)
        run: mvn -B -q verify -Dtest='*IT' -DfailIfNoTests=false
        # GitHub-hosted ubuntu runners include Docker, so Testcontainers-based
        # integration tests (Postgres/Mongo/RabbitMQ) can run here directly.

      - name: Build jar
        run: mvn -B -q package -DskipTests

  frontend:
    name: Frontend (Node / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ecommerce-Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Ecommerce-Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Type-check and build
        run: npm run build
